name: CryptoRadarAKBot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot.py

      - name: Save seen pairs
        run: |
          git config user.name "CryptoRadarAKBot"
          git config user.email "actions@users.noreply.github.com"

          git add seen_pairs.json

          git diff --cached --quiet || git commit -m "Update seen pairs"

          git pull --rebase origin main

          git push origin main